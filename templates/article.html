<html>
	<head>
		<title>Squirrel News</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<meta name="description" content="Squirrel News - The latest stories, all from your favorite furry journalist." />
		<meta name="robots" content="index, follow" />
		<link rel="stylesheet" href="../static/assets/css/main.css" />
		<noscript><link rel="stylesheet" href="../static/assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
		<div id="wrapper">

			{% include "header.html" %}

			<!-- Main -->
			<div id="main">

				<section class="post">
					<header class="major">
						<span class="date">{{ article["date"] }}</span>
						<h1>{{ article["title"] }}</h1>
						<p>{{ article["subtitle"] }}</p>
					</header>
					<!-- Image URL is stripped of whitespace to handle API formatting quirks -->
					<div class="image main"><img src='{{ "".join(article["image"].split()) }}' alt="" /></div>
					{{ article["body"] | safe }}
				</section>

			</div>

			{% include "footer.html" %}
